name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fichiers
        run: mkdir -p www && echo '{"name":"cap-app","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0","@capacitor/local-notifications":"^6.0.0"}}' > package.json && echo '{"appId":"com.cap.app","appName":"Cap","webDir":"www"}' > capacitor.config.json && echo "" | base64 -d > www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Permission notifications
        continue-on-error: true
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Compiler APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Cap-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
